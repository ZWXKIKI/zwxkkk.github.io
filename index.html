            </table>

            <p class="text-danger">暂无借阅记录。</p>
        </div>

        <!-- 用户消息小窗 -->
        <div v-if="showUserMessageModal" class="modal" @click.self="closeUserMessageModal">
            <div class="modal-content">
                <h3>我的消息</h3>
                <div v-if="messages.length === 0" class="no-messages">暂无消息</div>
                <ul v-else class="list-group">
                    <li
                        v-for="msg in messages"
                        :key="msg.mailId"
                        class="list-group-item"
                        :class="{ 'text-muted': msg.isRead }"
                        @mouseenter="showTooltip(msg.mailId)"
                        @mouseleave="hideTooltip()"
                    >

                            <p class="message-time"><small>{{ formatDate(msg.sendTime) }}</small></p>

                        </div>

                                @click.stop="markAsRead(msg.mailId)"

                            >

                            </button>
                            <button

                                @click.stop="markAsUnread(msg.mailId)"
                                class="btn btn-sm btn-outline-secondary"
                            >
                                标记未读
                            </button>
                        </div>
                    </li>
                </ul>

            </div>

        <button @click="logout" class="btn btn-danger mt-3 w-100">退出登录</button>

<script>
import axios from 'axios';

export default {
    name: 'UserProfile',
    computed: {
        currentUser() {
            const userJson = localStorage.getItem('user');
            console.log('user 数据:', userJson);
            const user = userJson ? JSON.parse(userJson) : null;
            return user;
        },
        isAdmin() {
            return this.currentUser?.role === 'Admin';
        },
        isUser() {
            return this.currentUser?.role === 'User';
        }
    },
    data() {
        return {
            user: {},
            libraryCard: null,
            borrowRecords: [],
            unreturnedCount: 0,
            showUserMessageModal: false,
            messages: [],
            unreadCount: 0,
            tooltipId: null
        };
    },
    created() {
        const token = localStorage.getItem('token');
        const userData = localStorage.getItem('user');
        console.log('Token:', token);
        console.log('UserData:', userData);
        axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;

        if (userData) {
            try {
                this.user = JSON.parse(userData);
                this.fetchUserMessages();
                this.fetchLibraryCard();
            } catch (e) {
                console.error('Failed to parse user data:', e);
                this.$router.push('/login');
                return;
            }
        } else {
            console.warn('No user data found, redirecting to login');
            this.$router.push('/login');
            return;
        }

        axios.interceptors.response.use(
            response => response,
            error => {
                if (error.response && error.response.status === 401) {
                    console.error('Token expired or unauthorized, redirecting to login');
                    this.$router.push('/login');
                }
                return Promise.reject(error);
            }
        );
    },
    methods: {
        async fetchUserMessages() {
            try {
                const response = await axios.get('/api/Mail/messages');
                console.log('Messages response:', response.data);
                this.messages = response.data.messages || [];
                this.unreadCount = this.messages.filter(msg => !msg.isRead).length;
                console.log('Messages:', this.messages);
                console.log('Unread count:', this.unreadCount);
            } catch (error) {
                console.error('获取消息失败:', error);
                this.messages = [];
                this.unreadCount = 0;
                if (error.response?.status === 401) {
                    this.$router.push('/login');
                }
            }
        },
        async markAsRead(mailId) {
            console.log('Marking message as read:', mailId);
            try {
                await axios.put(`/api/Mail/mark-read/${mailId}`);
                console.log('Message marked as read:', mailId);
                await this.fetchUserMessages();
            } catch (error) {
                console.error('标记已读失败:', error);
                alert('标记已读失败，请稍后再试');
            }
        },
        async markAsUnread(mailId) {
            console.log('Marking message as unread:', mailId);
            try {
                await axios.put(`/api/Mail/mark-unread/${mailId}`);
                console.log('Message marked as unread:', mailId);
                await this.fetchUserMessages();
            } catch (error) {
                console.error('标记未读失败:', error);
                alert('标记未读失败，请稍后再试');
            }
        },
        formatDate(dateString) {
            return new Date(dateString).toLocaleDateString();
        },
        closeUserMessageModal() {
            this.showUserMessageModal = false;
            this.tooltipId = null;
        },
        showTooltip(mailId) {
            console.log('Show tooltip for mailId:', mailId);
            this.tooltipId = mailId;
        },
        hideTooltip() {
            console.log('Hide tooltip');
            this.tooltipId = null;
        },
        viewBookDetail(bookId) {
            this.$router.push(`/book/${bookId}`);
        },
        async fetchLibraryCard() {
            try {
                const response = await axios.get(`/api/librarycard/getcard/${this.user.userId}`);
                this.libraryCard = response.data;
                if (this.libraryCard) {
                    this.fetchBorrowRecords();
                }
            } catch (error) {
                if (error.response && error.response.status === 404) {
                    this.libraryCard = null;
                } else {
                    console.error('获取借阅卡信息失败:', error);
                }
            }
        },
        async fetchBorrowRecords() {
            try {
                const response = await axios.get(`/api/borrowrecord/getrecords/${this.user.userId}`);
                const { borrowRecords, unreturnedCount } = response.data;

                this.borrowRecords = borrowRecords; // 注意大小写，确保属性名一致
                this.unreturnedCount = unreturnedCount;
                if (this.borrowRecords.length === 0 && this.unreturnedCount === 0) {
                    alert('借阅记录为空！');
                }
            } catch (error) {
                console.error('获取借阅记录失败:', error);
                alert('获取借阅记录失败，请稍后再试');
            }
        },
        async createLibraryCard() {
            try {
                const response = await axios.post('/api/librarycard/create', {
                    UserId: this.user.userId,
                });
                if (response.status === 200) {
                    this.libraryCard = response.data;
                    alert('借阅卡创建成功！');
                } else {
                    alert('借阅卡创建失败！');
                }
            } catch (error) {
                console.error('创建借阅卡时出错:', error);
                alert('创建借阅卡失败，请稍后再试');
            }
        },
        logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            this.$router.push('/homepage');
        },
        gotohomepage() {
            this.$router.push('/homepage');
        },
        goToBookList() {
            this.$router.push('/books');
        },
        goToMessages() {
            this.showUserMessageModal = true;
            this.fetchUserMessages();
        },
        goToLendingManagement() {
            this.$router.push('/lending-management');
        },
        goToManager() {
            this.$router.push('/manager');
        },
    }
};
</script>
